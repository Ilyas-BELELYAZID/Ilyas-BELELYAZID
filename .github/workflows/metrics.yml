name: 📊 Generate Premium GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📈 Generate Comprehensive GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Core Configuration
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Styling & Appearance
          config_timezone: Africa/Casablanca
          config_order: base.header, isocalendar, languages, activity, lines, notable, introduction
          
          # 📅 Contribution Calendar (ISO Week View)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 💻 Language Statistics (Top Languages Used)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html,css
          plugin_languages_colors: github
          plugin_languages_skipped: ""
          
          # 📊 Recent Activity (Latest Commits/PRs/Issues)
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          
          # 📝 Lines of Code Contributed
          plugin_lines: yes
          plugin_lines_history_limit: 1
          
          # ⭐ Notable & Starred Repositories
          plugin_notable: yes
          plugin_notable_from: repositories
          plugin_notable_types: starred
          
          # 👋 Personal Introduction
          plugin_introduction: yes
          plugin_introduction_title: true
          
          # 🎯 Achievement Badges
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          
          # 📌 Repository Statistics
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          plugin_repositories_starred: yes
          plugin_repositories_forks: no
          
          # 🏆 Skill/Topic Distribution
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          
          # 🤝 Collaboration Stats
          plugin_contributors: yes
          plugin_contributors_base: ""
          plugin_contributors_sections: contributors
          plugin_contributors_head: ""
          plugin_contributors_ignored: ""

      - name: 📤 Commit Metrics to Repository
        run: |
          git config user.name "GitHub Metrics Bot"
          git config user.email "metrics@github.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update GitHub metrics dashboard" && git push)
        continue-on-error: true
