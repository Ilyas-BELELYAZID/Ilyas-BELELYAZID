name: Generate Premium Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#1F2937,#374151,#4B5563,#6B7280
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#111827,#1F2937,#374151,#4B5563
            dist/ocean-snake.svg?palette=ocean-dark&color_snake=#38BDF8&color_dots=#0F172A,#1E293B,#334155,#475569
            dist/neon-snake.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0F172A,#111827,#1F2937,#374151

      - name: Deploy generated snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true